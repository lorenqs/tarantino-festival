<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Della+Respira&family=Bebas+Neue&family=Raleway:wght@300;400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cadastro.css">
    <title>TARANTINO FEST - CADASTRO</title>
</head>

<body>

    <div id="carouselFundo" class="carousel slide carousel-fade" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="killbill.jpg" alt="Kill Bill">
            </div>
            <div class="carousel-item">
                <img src="pulpfiction.jpg" alt="Pulp Fiction">
            </div>
            <div class="carousel-item">
                <img src="hollywood.jpg" alt="Era Uma Vez em... Hollywood">
            </div>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-tarantino">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">TARANTINO FEST</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarTarantino">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarTarantino">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/projeto-contador/index.html">INÍCIO</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/programacao/programação.html">PROGRAMAÇÃO</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link destaque active" href="cadastro.html">CADASTRO</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="cadastro-container">
        <section class="cadastro-card">
            <div class="titulo">
                <p class="mini-titulo">QUENTIN TARANTINO</p>
                <h1>CADASTRO</h1>
                <p class="subtitulo">Garanta sua presença no TARANTINO FILM FESTIVAL.</p>
            </div>

            <form id="formCadastro">
                <div class="campo">
                    <label for="nome">NOME COMPLETO</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="email">E-MAIL</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label for="telefone">TELEFONE</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
                    </div>

                    <div class="campo">
                        <label for="ingressos">INGRESSOS</label>
                        <select id="ingressos" name="ingressos" required>
                            <option value="" selected disabled>Selecione</option>
                            <option value="1">01 ingresso</option>
                            <option value="2">02 ingressos</option>
                            <option value="3">03 ingressos</option>
                            <option value="4">04 ingressos</option>
                            <option value="5">05 ingressos</option>
                        </select>
                    </div>
                </div>

                <div class="campo">
                    <label for="filme">FILME DE INTERESSE</label>
                    <select id="filme" name="filme">
                        <option value="" selected disabled>Escolha uma sessão</option>
                        <option>Cães de Aluguel</option>
                        <option>Pulp Fiction</option>
                        <option>Jackie Brown</option>
                        <option>Kill Bill Vol. 1</option>
                        <option>Kill Bill Vol. 2</option>
                        <option>À Prova de Morte</option>
                        <option>Bastardos Inglórios</option>
                        <option>Django Livre</option>
                        <option>Era Uma Vez em... Hollywood</option>
                    </select>
                </div>

                <div class="checkbox">
                    <input type="checkbox" id="termos" required>
                    <label for="termos">Concordo com o cadastro para participação no evento.</label>
                </div>

                <button type="submit">GARANTIR MEU INGRESSO</button>

                <p id="mensagem"></p>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById("formCadastro").addEventListener("submit", function(event) {
            event.preventDefault();

            const nome = document.getElementById("nome").value.trim();
            const mensagem = document.getElementById("mensagem");

            mensagem.textContent = "Cadastro realizado com sucesso, " + nome + "!";
            mensagem.classList.add("sucesso");

            this.reset();
        });
    </script>

</body>
</html>
